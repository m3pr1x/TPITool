# Déploiement en un clic : https://render.com → « New + » → « Blueprint » → ce dépôt.
services:
  - type: web
    name: tpitool
    runtime: python
    plan: free
    region: frankfurt          # oregon / ohio / virginia / singapore possibles
    branch: main
    buildCommand: pip install -r requirements.txt
    # Render fournit $PORT (10000 par défaut) ; la valeur de repli permet de
    # lancer la même commande ailleurs sans rien changer.
    startCommand: uvicorn app:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /sante          # non protégé : sinon le 401 fait échouer le déploiement
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Mot de passe d'accès généré par Render : visible dans l'onglet
      # Environment du service. Sans lui, n'importe qui peut déposer des fichiers.
      - key: TPITOOL_MDP
        generateValue: true
