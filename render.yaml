# Déploiement en un clic sur https://render.com — « New + » → « Blueprint » → ce dépôt.
services:
  - type: web
    name: tpitool
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/unites
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Protège le lien par un mot de passe : Render en génère un et l'affiche
      # dans l'onglet Environment du service.
      - key: TPITOOL_MDP
        generateValue: true
